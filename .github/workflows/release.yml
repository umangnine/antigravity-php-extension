name: Package & Release Bundle

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    name: Create Offline Release Bundle
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Package Release ZIP
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if (-not $version -or $version -notmatch '^v\d') {
            $version = "v1.0.0"
          }
          $zipName = "antigravity-php-extension-$version-portable.zip"
          Compress-Archive -Path `
            install.ps1, `
            uninstall.ps1, `
            enable-php-highlighting.ps1, `
            phpHighlighting.js, `
            patch-asar.js, `
            restore-asar.js, `
            inject-live.js, `
            package.json, `
            package-lock.json, `
            README.md, `
            LICENSE, `
            node_modules `
            -DestinationPath $zipName
          Write-Host "Created bundle: $zipName"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: antigravity-php-extension-*.zip
          generate_release_notes: true
